name: Release

# Push a tag like v0.2.0 to build the installer and publish it as a GitHub release.
# Installed copies check GitHub Releases and update themselves.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Holds the UPDATE_SIGNING_KEY secret. Give it a required reviewer so every release waits for approval.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build, pack and publish
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: ./build/publish.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') -GitHubToken $env:GITHUB_TOKEN
