name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check formatting
        # The layout rules in .editorconfig. To fix: dotnet format whitespace ImpiousBonum.slnx
        run: dotnet format whitespace ImpiousBonum.slnx --verify-no-changes
      - name: Build and test
        run: dotnet test ImpiousBonum.slnx -c Release
